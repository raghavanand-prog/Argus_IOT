[project]
name = "argus"
version = "0.1.0"
description = "Closed-loop, evidence-bound IoT intrusion detection and autonomous response"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "river>=0.21",
    "python-multipart>=0.0.9",
    "scipy>=1.11",
    "shap>=0.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]
# Only needed for the real network-namespace testbed (argus/testbed/) -- requires
# Linux + root/CAP_NET_ADMIN. The synthetic sim engine and the rest of the system
# work without these. See docs/04b-live-testbed.md.
live-testbed = ["pyroute2>=0.7", "scapy>=2.5", "dpkt>=1.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argus*"]
